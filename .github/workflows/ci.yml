name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
      - name: Install OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
